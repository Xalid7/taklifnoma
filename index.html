<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Great+Vibes&family=Marck+Script&display=swap">
<style>
/* Layout: to'liq ekranli qizil konvert -> muhr bosilganda ochiladi -> oq, tor ustunli taklifnoma; bitta ko'rinish (light) */
:root{
  --crimson:#8E1537;
  --crimson-deep:#6B0F29;
  --crimson-soft:#A3214A;
  --gold:#D9B26A;
  --gold-deep:#B88A3B;
  --paper:#FFFFFF;
  --ink:#3A1420;
  --muted:#8A6B73;
  --line:#E9DCDF;
  --script:"Great Vibes","Marck Script",cursive;
  --serif:"Cormorant Garamond","Times New Roman",Georgia,serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:#F3ECEE;color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.55;margin:0}
body.locked{overflow:hidden}

/* ---------- top controls ---------- */
.ctrl{position:fixed;z-index:50;top:calc(14px + env(safe-area-inset-top,0px));display:flex;gap:4px}
.ctrl.left{left:14px}.ctrl.right{right:14px}
.icon-btn{width:40px;height:40px;border-radius:8px;border:0;background:rgba(255,248,236,.85);color:var(--gold-deep);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.icon-btn.on{background:var(--gold);color:#fff}
.lang{background:rgba(255,248,236,.85);border-radius:8px;padding:3px;display:flex;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.lang button{border:0;background:transparent;font:600 13px/1 var(--serif);letter-spacing:.08em;color:var(--muted);padding:8px 10px;border-radius:6px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--gold);color:#fff}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- envelope ---------- */
#envelope{position:fixed;inset:0;z-index:40;overflow:hidden;background:#4D0A1C}
.env-part{position:absolute;inset:0;transition:transform 1.1s cubic-bezier(.7,0,.3,1),opacity 1.1s}
.env-body{background:radial-gradient(85% 60% at 50% 72%,#7E1834,#5A0E22 55%,#33060F);clip-path:polygon(0 0,50% 58%,100% 0,100% 100%,0 100%)}
.env-flap{background:linear-gradient(180deg,#741530,#4D0A1C);clip-path:polygon(0 0,100% 0,50% 58%);filter:drop-shadow(0 12px 14px rgba(0,0,0,.45))}
.env-noise,.env-pat,.env-lines{position:absolute;inset:0;width:100%;height:100%}
.env-noise{mix-blend-mode:screen}
.env-rose{position:absolute;left:50%;top:39%;width:clamp(56px,16vw,72px);transform:translate(-50%,-50%);opacity:.9}
.br{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));width:42px;height:42px;border-top:1.4px solid #C9A04A}
.br-l{left:22px;border-left:1.4px solid #C9A04A}.br-r{right:22px;border-right:1.4px solid #C9A04A}
.env-text{position:absolute;left:0;right:0;top:calc(10% + env(safe-area-inset-top,0px));text-align:center;color:#F6E3A6;padding-inline:16px;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.env-text .l1{font:600 clamp(13px,3.6vw,18px)/1 var(--serif);letter-spacing:.42em}
.env-text .l2{font:600 clamp(26px,7.6vw,44px)/1.05 var(--serif);letter-spacing:.06em;margin-top:10px;text-transform:uppercase}
.env-text .l3{font:400 clamp(32px,9.6vw,56px)/1 var(--script);margin-top:4px}
.env-sign{position:absolute;left:0;right:0;bottom:calc(6% + env(safe-area-inset-bottom,0px));text-align:center;color:#8E1537}
.env-sign .s1{font:italic 500 17px var(--serif);opacity:.9}
.env-sign .s2{font:600 13px var(--serif);letter-spacing:.22em;text-transform:uppercase;margin-top:4px}
#seal{position:absolute;left:50%;top:58%;width:128px;height:128px;transform:translate(-50%,-50%);border:0;padding:0;background:transparent;cursor:pointer;transition:transform .9s,opacity .7s;z-index:3}
#seal svg{width:100%;height:100%;filter:drop-shadow(0 8px 12px rgba(0,0,0,.5))}
#seal .lbl{position:absolute;left:50%;top:calc(100% + 10px);transform:translateX(-50%);font:700 11px var(--serif);letter-spacing:.32em;color:#F6E3A6;text-transform:uppercase;white-space:nowrap}
#seal::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px solid rgba(217,178,106,.55);animation:pulse 2.2s ease-out infinite}
@keyframes pulse{from{transform:scale(.9);opacity:1}to{transform:scale(1.35);opacity:0}}
#envelope.open .env-flap{transform:translateY(-100%)}
#envelope.open .env-body{transform:translateY(100%)}
#envelope.open #seal{transform:translate(-50%,-50%) scale(1.6);opacity:0}
#envelope.gone{display:none}

/* ---------- invitation ---------- */
.page{max-width:480px;margin:0 auto;background:var(--paper);min-height:100%;box-shadow:0 0 40px rgba(107,15,41,.12);overflow:hidden}
.suzani{height:72px;background-repeat:repeat-x;background-size:auto 72px;background-position:0 center;animation:drift 40s linear infinite}
@keyframes drift{to{background-position:172px center}}
.sec{padding-inline:24px;text-align:center}
.hero{padding-block:22px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.karnay{position:relative;width:calc(100% + 48px);margin-inline:-24px;height:clamp(78px,24vw,112px);overflow:hidden}
.karnay .k{position:absolute;bottom:4%;width:55%;transition:transform 3.4s cubic-bezier(.22,.7,.25,1) 1.1s}
.karnay .k1{left:-7%;transform:translate(-100%,45%)}.karnay .k2{right:-7%;transform:translate(100%,45%)}
.karnay .rot{display:block}
.karnay .k1 .rot{transform:rotate(-11deg)}.karnay .k2 .rot{transform:rotate(11deg)}
.karnay img{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 4px rgba(90,60,8,.25))}
.karnay .k2 img{transform:scaleX(-1)}
body.opened .karnay .k1,body.opened .karnay .k2{transform:none}
body.opened .karnay .k1 .rot{animation:toot 4.2s ease-in-out 4.5s infinite}
body.opened .karnay .k2 .rot{animation:toot2 4.2s ease-in-out 4.5s infinite}
@keyframes toot{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(-12.6deg)}}
@keyframes toot2{0%,100%{transform:rotate(11deg)}50%{transform:rotate(12.6deg)}}
.karnay .waves{position:absolute;left:50%;top:38%;width:46px;height:46px;transform:translate(-50%,-50%);opacity:0;pointer-events:none}
body.opened .karnay .waves{animation:waves 4.2s ease-out 4.5s infinite}
.karnay .waves span{position:absolute;inset:0;border-radius:50%;border:1.5px solid #D4A646}
.karnay .waves span:nth-child(2){inset:9px;border-color:#8E1537}
.karnay .waves span:nth-child(3){inset:17px;background:#D4A646;border:0}
@keyframes waves{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}

.names{font:400 clamp(54px,15vw,74px)/1.05 var(--script);color:var(--crimson);margin:6px 0 0;text-wrap:balance}
.names .va{display:block;font:italic 500 22px/1.4 var(--serif);color:var(--muted)}
.couple{width:min(280px,74%);height:auto;margin-top:10px;mix-blend-mode:multiply;display:block}
.scroll-hint{font:600 12px var(--serif);letter-spacing:.26em;color:var(--muted);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px}
.scroll-hint span{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.greet{text-align:center;margin:26px 18px 0;background:var(--crimson);color:#FBEFE2;border-radius:10px;padding:34px 22px 30px;box-shadow:0 14px 30px -14px rgba(107,15,41,.6)}
.greet h2{font:400 clamp(38px,10vw,48px)/1.1 var(--script);margin:0 0 18px;color:#FBE8C8;text-wrap:balance}
.greet p{margin:0 auto 14px;max-width:30ch;font-size:18px}
.greet p:last-child{margin-bottom:0}
.cal{padding-block:30px 10px}
.cal-head{display:flex;align-items:center;justify-content:center;gap:10px}
.cal-head svg{width:56px;height:56px}
.anor{display:block;height:auto;mix-blend-mode:multiply}.anor-cal{width:70px}.anor-bye{width:110px;margin-top:6px}
.cal-title{font:400 44px/1 var(--script);color:var(--crimson)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px 0;margin-top:20px;font-variant-numeric:tabular-nums}
.grid .wd{font:600 12px var(--serif);letter-spacing:.08em;color:var(--muted);padding-bottom:8px;text-transform:uppercase}
.grid .d{height:40px;display:grid;place-items:center;font-size:18px;color:var(--ink);position:relative}
.grid .d.out{color:#C9B5BA}
.grid .d.hit{color:#fff;font-weight:700}
.grid .d.hit svg{position:absolute;inset:-2px;margin:auto;width:46px;height:46px;z-index:0;animation:beat 1.4s ease-in-out infinite}
.grid .d.hit b{position:relative;z-index:1}
@keyframes beat{50%{transform:scale(1.1)}}
.time-line{margin-top:14px;font:italic 500 19px var(--serif);color:var(--muted)}
.divider{width:60%;height:1px;background:var(--line);margin:28px auto}
.venue h2,.count h2{font:400 46px/1.1 var(--script);color:var(--crimson);margin:0 0 10px}
.venue .vn{font:600 18px/1.3 var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.venue .va2{color:var(--muted);margin-top:4px}
.venue .ml{color:var(--muted);font-size:16px;margin-top:6px}
.btns{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.btns a{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;border:1.5px solid var(--crimson);border-radius:8px;color:var(--crimson);text-decoration:none;font:700 14px var(--serif);letter-spacing:.2em;text-transform:uppercase;transition:background .2s,color .2s}
.btns a:hover{background:var(--crimson);color:#fff}
.count{padding-bottom:8px}
.clock{display:flex;justify-content:center;align-items:flex-start;gap:6px;font-variant-numeric:tabular-nums}
.clock .u{min-width:62px}
.clock b{display:block;font:500 40px/1.1 var(--serif);color:var(--ink)}
.clock small{font:600 11px var(--serif);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.clock .sep{font:500 34px/1.1 var(--serif);color:var(--gold-deep)}
.bye{padding-block:22px 34px;display:flex;flex-direction:column;align-items:center;gap:8px}
.bye p{margin:0;font:italic 500 21px var(--serif);color:var(--muted)}
.bye svg{width:84px;height:84px}
.bye .resp{margin-top:10px;font:600 12px var(--serif);letter-spacing:.26em;text-transform:uppercase;color:var(--muted)}
.bye .fam{font:400 44px/1.1 var(--script);color:var(--crimson)}
.ml:empty{display:none}
.rise{animation:rise .9s ease-out both}
@keyframes rise{from{transform:translateY(14px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.suzani,.scroll-hint span,.grid .d.hit svg,#seal::after{animation:none!important}}
</style>


<div class="ctrl right"><div class="lang" role="group" aria-label="Til">
  <button type="button" id="ruBtn" aria-pressed="false">RU</button>
  <button type="button" id="uzBtn" aria-pressed="true">UZ</button>
</div></div>

    <svg class="env-lines" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">

  // calendar
  function cal(){
    var g = document.getElementById("grid"), h = "", y = WED.getFullYear(), mo = WED.getMonth(), day = 24;
    // use the date in Tashkent
    var parts = DATA.date.slice(0,10).split("-"); y=+parts[0]; mo=+parts[1]-1; day=+parts[2];
    T[lang].wd.forEach(function(w){ h += '<div class="wd">'+w+'</div>'; });
    var first = new Date(y,mo,1), lead = (first.getDay()+6)%7, dim = new Date(y,mo+1,0).getDate(), prev = new Date(y,mo,0).getDate();
    for(var i=lead;i>0;i--) h += '<div class="d out">'+(prev-i+1)+'</div>';
    for(var d=1; d<=dim; d++){
      if(d===day) h += '<div class="d hit"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#C0202F" d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 5.3 3.2 1.7-2 3.2-3.2 5.3-3.2 3.7 0 5.9 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></svg><b>'+d+'</b></div>';
      else h += '<div class="d">'+d+'</div>';
    }
    var tail = (7 - (lead+dim)%7)%7;
    for(var j=1;j<=tail;j++) h += '<div class="d out">'+j+'</div>';
    g.innerHTML = h;
  }

  function apply(){
    var t = T[lang];
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function(el){ var k = el.getAttribute("data-t"); if(t[k]!=null) el.textContent = t[k]; });
    document.getElementById("uzBtn").setAttribute("aria-pressed", lang==="uz");
    document.getElementById("ruBtn").setAttribute("aria-pressed", lang==="ru");
    cal();
  }
  document.getElementById("uzBtn").onclick = function(){ lang="uz"; try{localStorage.setItem("lang",lang)}catch(e){} apply(); };
  document.getElementById("ruBtn").onclick = function(){ lang="ru"; try{localStorage.setItem("lang",lang)}catch(e){} apply(); };
  apply();

  // maps
  document.getElementById("yandex").href = "https://yandex.uz/maps/?pt="+DATA.lon+","+DATA.lat+"&z=17&l=map";
  document.getElementById("google").href = "https://www.google.com/maps/search/?api=1&query="+DATA.lat+","+DATA.lon;


  // envelope
  var env = document.getElementById("envelope");
  document.body.classList.add("locked");
  document.getElementById("seal").onclick = function(){
    env.classList.add("open"); document.body.classList.add("opened");
    setTimeout(function(){ env.classList.add("gone"); document.body.classList.remove("locked"); window.scrollTo(0,0); }, 1150);
  };

  // countdown
  function pad(n){ return String(n).padStart(2,"0"); }
  function tick(){
    var diff = Math.max(0, WED - new Date()), s = Math.floor(diff/1000);
    document.getElementById("cd-d").textContent = Math.floor(s/86400);
    document.getElementById("cd-h").textContent = pad(Math.floor(s%86400/3600));
    document.getElementById("cd-m").textContent = pad(Math.floor(s%3600/60));
    document.getElementById("cd-s").textContent = pad(s%60);
  }
  tick(); setInterval(tick,1000);
})();
</script>
